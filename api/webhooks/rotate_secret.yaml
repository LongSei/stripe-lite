post:
  summary: Rotate a webhook endpoint signing secret
  description: |
    Rotates the signing secret for a webhook endpoint belonging to the authenticated merchant.
    The old secret is invalidated when rotation succeeds. The new whsec_-prefixed secret
    must be used to sign webhook deliveries afterward. Rotation logic is not implemented yet.
  operationId: rotateWebhookSecret
  tags:
    - Webhooks
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the webhook endpoint.
      schema:
        type: string
      example: "we_01HXZ5M4N5P678"
    - $ref: "../components/headers.yaml#/XRequestIdHeader"
  responses:
    "200":
      description: A new signing secret was generated successfully.
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/RotateWebhookSecretResponse"
          example:
            id: "we_01HXZ5M4N5P678"
            secret: "whsec_NEW789SECRET456"
    "401":
      description: Authentication credentials are missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
          example:
            type: "https://api.stripe-lite.internal/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "A valid API credential is required."
            instance: "/requests/req_9b1deb4d3b7d"
    "403":
      description: The authenticated caller is not allowed to rotate webhook endpoint secrets.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
          example:
            type: "https://api.stripe-lite.internal/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "The API credential does not have permission to rotate webhook endpoint secrets."
            instance: "/requests/req_9b1deb4d3b7d"
    "404":
      description: The webhook endpoint does not exist for the authenticated merchant.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
          example:
            type: "https://api.stripe-lite.internal/errors/not-found"
            title: "Not Found"
            status: 404
            detail: "The requested webhook endpoint was not found."
            instance: "/requests/req_9b1deb4d3b7d"
    "500":
      description: The webhook endpoint secret could not be rotated because of an unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
          example:
            type: "https://api.stripe-lite.internal/errors/internal"
            title: "Internal Server Error"
            status: 500
            detail: "The webhook endpoint signing secret could not be rotated."
            instance: "/requests/req_9b1deb4d3b7d"
