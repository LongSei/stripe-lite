StartingAfterQueryParam:
  name: starting_after
  in: query
  required: false
  description: |-
    This cursor selects the page after the specified resource.
    Use the last ID from the previous page.

    The cursor must identify a resource in the requested collection.
    Use `pi_*` for payment intents.
    Use `re_*` for refunds.
    Use `cus_*` for customers.

    The resource must belong to the authenticated merchant.
    The resource must match the active filters.
    The schema example uses a PaymentIntent ID.
    Other collections require their own ID type.
  schema:
    type: string
    example: pi_01HXZ5JABC1234
EndingBeforeQueryParam:
  name: ending_before
  in: query
  required: false
  description: |-
    This cursor selects the page before the specified resource.
    Use the first ID from the previous page.

    The cursor must identify a resource in the requested collection.
    Use `pi_*` for payment intents.
    Use `re_*` for refunds.
    Use `cus_*` for customers.

    The resource must belong to the authenticated merchant.
    The resource must match the active filters.
    The schema example uses a PaymentIntent ID.
    Other collections require their own ID type.
  schema:
    type: string
    example: pi_01HXZ5JABC1234
LimitQueryParam:
  name: limit
  in: query
  required: false
  description: This value sets the number of returned resources. The value is 1 to 100. The default value is 10.
  schema:
    type: integer
    default: 10
    minimum: 1
    maximum: 100
    example: 10
