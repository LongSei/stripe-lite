ProblemDocument:
  type: object
  description: This object describes an HTTP API error. The format follows RFC 7807.
  externalDocs:
    description: This document defines the error format.
    url: https://datatracker.ietf.org/doc/html/rfc7807
  required:
    - type
    - title
    - status
  properties:
    type:
      type: string
      format: uri
      description: This URI identifies the error type.
      example: https://api.stripe-lite.internal/errors/invalid-request
    title:
      type: string
      description: This text gives a short error title.
      example: Bad Request
    status:
      type: integer
      format: int32
      description: This value gives the HTTP status from the server.
      example: 400
    detail:
      type: string
      description: This text explains the error for this request.
      example: The amount parameter must be a positive integer in smallest currency units.
    instance:
      type: string
      format: uri-reference
      description: This URI identifies the specific error.
      example: /requests/req_9b1deb4d3b7d
    invalid_params:
      type: array
      description: This array lists the invalid fields.
      items:
        $ref: '#/InvalidParam'
InvalidParam:
  type: object
  required:
    - name
    - reason
  properties:
    name:
      type: string
      description: This value gives the name or path of the invalid field.
      example: amount
    reason:
      type: string
      description: This text explains why the field is invalid.
      example: Must be greater than 0
