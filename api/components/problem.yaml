ProblemDocument:
  type: object
  description: |
    RFC 7807 Problem Details representation for HTTP APIs.
    See: https://datatracker.ietf.org/doc/html/rfc7807
  externalDocs:
    description: RFC 7807 Specification
    url: https://datatracker.ietf.org/doc/html/rfc7807
  required:
    - type
    - title
    - status
  properties:
    type:
      type: string
      format: uri
      description: A URI reference identifying the problem type.
      example: "https://api.stripe-lite.internal/errors/invalid-request"
    title:
      type: string
      description: A short, human-readable summary of the problem type.
      example: "Bad Request"
    status:
      type: integer
      format: int32
      description: The HTTP status code generated by the origin server.
      example: 400
    detail:
      type: string
      description: A human-readable explanation specific to this occurrence of the problem.
      example: "The amount parameter must be a positive integer in smallest currency units."
    instance:
      type: string
      format: uri-reference
      description: A URI reference that identifies the specific occurrence of the problem.
      example: "/requests/req_9b1deb4d3b7d"
    invalid_params:
      type: array
      description: Granular field-level validation errors.
      items:
        $ref: "#/InvalidParam"

InvalidParam:
  type: object
  required:
    - name
    - reason
  properties:
    name:
      type: string
      description: The path or name of the invalid field or parameter.
      example: "amount"
    reason:
      type: string
      description: Reason why parameter failed validation constraints.
      example: "Must be greater than 0"
