name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Verify required tools
        run: |
          make --version
          bash --version
          curl --version

      - name: Download Go modules
        run: go mod download

      - name: Lint OpenAPI spec
        run: make lint-spec

      - name: Lint OpenAPI with Redocly
        run: make lint-redocly

      - name: Generate OpenAPI code
        run: make codegen

      - name: Check generated code
        run: git diff --exit-code -- internal/api/v1/v1.gen.go

      - name: Run tests
        run: make test

      - name: Run verification suite
        run: make verify
